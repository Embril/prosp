name: Daglig fiber-prospektering

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  prospekter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer avhengigheter
        run: pip install requests
      - name: Kjør prospektering
        env:
          NETHUNT_EMAIL: ${{ secrets.NETHUNT_EMAIL }}
          NETHUNT_API_KEY: ${{ secrets.NETHUNT_API_KEY }}
        run: python prospekter_cloud.py --postnummer 3510
      - name: Commit oppdatert duplikat-liste
        run: |
          git config user.name "prospekter-bot"
          git config user.email "actions@github.com"
          git add seen_orgnr.json
          git diff --quiet --cached || git commit -m "Oppdater seen_orgnr.json etter kjøring $(date -u +%F)"
          git push
